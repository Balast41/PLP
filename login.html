<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ApprenTSAge</title>
        <link rel="stylesheet" href="stylesHeader.css">
        <link rel="stylesheet" href="stylesFooter.css">
        <link rel="stylesheet" href="stylesLogin.css">
    </head>
    <body>
        <div id="site-header"></div>
        <form id="loginForm">
            <h2>Connexion</h2>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required>
            <input type="checkbox" id="showPassword" onchange="togglePasswordVisibility('password')">Afficher le mot de passe
            <button type="submit" onclick="location.href='exosR.html'">Se connecter</button>
        </form>
        <div id="site-footer"></div>
        <script src="components.js"></script>
    </body>
</html>
